<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="board" cx="50%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#6a3a18"/>
      <stop offset="60%" stop-color="#3B1F0A"/>
      <stop offset="100%" stop-color="#1a0a02"/>
    </radialGradient>
    <radialGradient id="pit" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#000"/>
      <stop offset="70%" stop-color="#0D0500"/>
      <stop offset="100%" stop-color="#1A0A02"/>
    </radialGradient>
    <radialGradient id="seedA" cx="35%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#e6c9a0"/>
      <stop offset="100%" stop-color="#8b6b44"/>
    </radialGradient>
    <radialGradient id="seedB" cx="35%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#a15a2a"/>
      <stop offset="100%" stop-color="#5a2a10"/>
    </radialGradient>
  </defs>

  <!-- background disc with safe area (maskable) -->
  <circle cx="256" cy="256" r="256" fill="#1B3A2D"/>

  <!-- board plate -->
  <rect x="48" y="108" width="416" height="296" rx="48" ry="48" fill="url(#board)" stroke="#DAA520" stroke-width="6"/>

  <!-- pits (2x4 for simplicity within icon space) -->
  <g>
    <circle cx="120" cy="190" r="34" fill="url(#pit)"/>
    <circle cx="208" cy="190" r="34" fill="url(#pit)"/>
    <circle cx="296" cy="190" r="34" fill="url(#pit)"/>
    <circle cx="384" cy="190" r="34" fill="url(#pit)"/>
    <circle cx="120" cy="322" r="34" fill="url(#pit)"/>
    <circle cx="208" cy="322" r="34" fill="url(#pit)"/>
    <circle cx="296" cy="322" r="34" fill="url(#pit)"/>
    <circle cx="384" cy="322" r="34" fill="url(#pit)"/>
  </g>

  <!-- seeds -->
  <g>
    <ellipse cx="200" cy="185" rx="7" ry="5" fill="url(#seedA)"/>
    <ellipse cx="216" cy="196" rx="7" ry="5" fill="url(#seedB)" transform="rotate(20 216 196)"/>
    <ellipse cx="290" cy="186" rx="7" ry="5" fill="url(#seedB)"/>
    <ellipse cx="302" cy="198" rx="7" ry="5" fill="url(#seedA)" transform="rotate(-25 302 198)"/>
    <ellipse cx="380" cy="320" rx="7" ry="5" fill="url(#seedA)"/>
    <ellipse cx="392" cy="328" rx="7" ry="5" fill="url(#seedB)" transform="rotate(15 392 328)"/>
  </g>

  <!-- Kannada character ಚ (cha) -->
  <text x="256" y="460" text-anchor="middle"
        font-family="Tiro Kannada, serif" font-size="72" font-weight="700"
        fill="#FFD700"
        style="text-shadow: 0 2px 4px rgba(0,0,0,0.8);">ಚ</text>
</svg>
